allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: false

engineStrict: true

# pnpm holds back any version younger than minimumReleaseAge (1 day by
# default). @freelensapp/extensions is adopted on the day of a Freelens
# release, together with the stack it was built with. The other entries are
# the ones Freelens has, one exact version each, for security fixes that
# cannot wait. Remove such an entry once that version is older than the
# policy: the exclusion is then a no-op.
minimumReleaseAgeExclude:
  - '@freelensapp/extensions'

shellEmulator: true

# Fail the install, instead of printing one warning line, when a library the
# extension shares with the host is outside the peer range of
# @freelensapp/extensions.
strictPeerDependencies: true

# Security fixes in dependencies of the development tools; none of them is
# bundled into the extension. Remove an entry once the package that pulls it
# in depends on the fixed version itself.
overrides:
  # monaco-editor pins dompurify 3.4.15 (GHSA-cg2g-xh64-v4q7 and others). The
  # extension compiles against monaco-editor for its types only; Freelens
  # ships the editor and overrides dompurify the same way.
  monaco-editor>dompurify: 3.4.17
  # @electron/get downloads Electron during pnpm install with undici.
  undici@<7.30.1: 7.30.2
  # ajv of conf, which @freelensapp/extensions depends on for its types.
  fast-uri@<3.1.9: 3.1.9
