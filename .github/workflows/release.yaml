name: Release

# Push a tag like v0.4.0 (or v1.0.0-beta.1): checks that it matches package.json, builds and tests the extension,
# stages it on npm, where a maintainer approves it to publish it (Freelens installs it from npm by name), and creates
# the GitHub release with the tarball, its checksum and the notes from CHANGELOG.md.
# Run it by hand (Actions > Release > Run workflow) to build the tarball as an artifact without releasing anything.
on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      # npm trusted publishing: npm exchanges the OIDC token of this workflow for a short-lived publish token, so the
      # repository keeps no npm token.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Version
        id: version
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in package.json"
            exit 1
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # The tarball pnpm packs: the scope without "@", joined to the name with "-".
          tarball="$(echo "${name}" | sed 's#^@##; s#/#-#')-${version}.tgz"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          # 0.x and versions with a suffix (-beta.1) are pre-releases on GitHub. On npm only a suffix keeps a version
          # off the "latest" dist-tag, which is what Freelens installs by name.
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install pnpm dependencies
        run: timeout 300 pnpm install --color=always --frozen-lockfile

      - name: Type check
        run: pnpm --color=always type:check

      - name: Unit tests
        run: pnpm --color=always test:unit

      - name: Build
        run: pnpm --color=always build

      # Freelens checks a tarball installed from a URL against the .tgz.sha256 next to it, in sha256sum format.
      - name: Pack
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          cd release
          test -f "${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          cat "${TARBALL}.sha256"
          tar -tzf "${TARBALL}"

      # A manual run stops here: the tarball is kept as the "release" artifact of the run.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

      # Staged publishing: the workflow only stages the version, which stays private until a maintainer approves it
      # on npmjs.com (Staged Packages, with 2FA); the approval publishes it under the dist-tag set here. The trusted
      # publisher on npmjs.com allows this workflow to stage and nothing else, so a compromised repository cannot publish.
      # npm stage publish packs the package root (the files of "files" in package.json, from the build above) and needs
      # npm 11.15.0 or newer, which the Node of .nvmrc ships. A version that is on npm already, such as the first one,
      # published by hand to create the package, is skipped.
      - name: Stage on npm
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          npm --version
          if [[ "$(npm view "${NAME}@${VERSION}" version --registry https://registry.npmjs.org/ 2>/dev/null)" == "${VERSION}" ]]; then
            echo "${NAME}@${VERSION} is on npm already"
            exit 0
          fi
          npm stage publish --access public --tag "${DIST_TAG}"
          echo "::notice::${NAME}@${VERSION} is staged on npm; approve it on npmjs.com under Staged Packages to publish it."

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The version's section of CHANGELOG.md; GitHub appends the link to the full list of changes.
          awk -v v="${VERSION}" 'index($0, "## " v " ") == 1 || $0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          cat notes.md
          flags=(--title "Pod File Browser ${VERSION}" --generate-notes)
          [[ -s notes.md ]] && flags+=(--notes-file notes.md)
          [[ "${PRERELEASE}" == true ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" release/* "${flags[@]}"
